stages:
  - quality
  - test

.php_job_template: &php_job_template
  image: php:8.4
  before_script:
    - apt-get update && apt-get install -y git unzip libzip-dev libicu-dev libonig-dev
    - apt-get install -y libsqlite3-dev libpq-dev
    - docker-php-ext-install pdo pdo_sqlite pdo_pgsql intl mbstring zip
    - pecl install xdebug
    - docker-php-ext-enable xdebug
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - bash tools/ci/address-provision-locked-siblings.sh
    - composer install --no-progress --no-interaction --prefer-dist

phpstan:
  stage: quality
  <<: *php_job_template
  script:
    - composer phpstan

psalm:
  stage: quality
  <<: *php_job_template
  script:
    - composer psalm

rector:
  stage: quality
  <<: *php_job_template
  script:
    - composer rector:dry

phpunit:
  stage: test
  <<: *php_job_template
  variables:
    MIN_COVERAGE: "80"
  script:
    - |
      set -eu
      export XDEBUG_MODE=coverage
      mkdir -p build/logs var/coverage
      rm -f build/logs/clover.xml build/logs/junit.xml var/coverage/summary.txt
      vendor/bin/phpunit --path-coverage --coverage-clover build/logs/clover.xml --log-junit build/logs/junit.xml --coverage-text=var/coverage/summary.txt > build/logs/coverage.txt || { cat build/logs/coverage.txt; exit 1; }
      cat build/logs/coverage.txt
      test -s var/coverage/summary.txt
      test -s build/logs/junit.xml
      cat var/coverage/summary.txt
      test -s build/logs/clover.xml
      php -r '$x = simplexml_load_file("build/logs/clover.xml"); $m = $x === false ? null : $x->project->metrics; $ns = (string) ($m["statements"] ?? ""); $cs = (string) ($m["coveredstatements"] ?? ""); $n = (int) $ns; $c = (int) $cs; $min = getenv("MIN_COVERAGE"); if (!ctype_digit($ns) || !ctype_digit($cs) || $n <= 0 || $c > $n || $min === false || !is_numeric($min) || (float) $min < 0 || (float) $min > 100) { fwrite(STDERR, "Invalid or missing coverage evidence\n"); exit(1); } $pct = 100 * $c / $n; printf("Coverage: %.2f%%\n", $pct); exit($pct < (float) $min ? 1 : 0);'
  artifacts:
    when: always
    reports:
      junit: build/logs/junit.xml
    paths:
      - build/logs/
      - var/coverage/summary.txt
  coverage: '/Lines.*: (\d+\.\d+%)/'


doctrine_smoke:
  stage: test
  <<: *php_job_template
  services:
    - name: postgres:15
      alias: pg
  variables:
    POSTGRES_DB: smartresponsor
    POSTGRES_USER: smartresponsor
    POSTGRES_PASSWORD: smartresponsor
    APP_ENV: test
    ADDRESS_PARITY_DATABASE_URL: 'postgresql://smartresponsor:smartresponsor@pg:5432/smartresponsor?serverVersion=15&charset=utf8'
  script:
    - composer qa:trust-surface
    - composer smoke:doctrine
    - composer schema:parity
    - composer gating
