openapi: 3.0.3
info:
    title: Addressing API compatibility entry point
    version: 0.1.0
    description: |
        Thin documentation entry point for the current Addressing API.
        The canonical contract and schemas are maintained in ../openapi/address.yaml.
paths:
    /api/address:
        $ref: '../openapi/address.yaml#/paths/~1api~1address'
    /api/address/page:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1page'
    /api/address/search:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1search'
    /api/address/queue-summary:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1queue-summary'
    /api/address/country-portfolio:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1country-portfolio'
    /api/address/source-portfolio:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1source-portfolio'
    /api/address/validation-portfolio:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1validation-portfolio'
    /api/address/normalization-portfolio:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1normalization-portfolio'
    /api/address/operational-batch:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1operational-batch'
    /api/address/{id}:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1{id}'
    /api/address/{id}/validated:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1{id}~1validated'
    /api/address/{id}/governance-cluster:
        $ref: '../openapi/address.yaml#/paths/~1api~1address~1{id}~1governance-cluster'
