name: addressing-gate-master

on:
  push:
    branches: [ "master" ]
    paths:
      - ".github/workflows/**"
      - "tools/**"
      - "config/**"
      - ".gitlab-ci.yml"
      - "phpstan.neon.dist"
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "docs/**"
      - "page/**"
  pull_request:
    branches: [ "master" ]
    paths:
      - ".github/workflows/**"
      - "tools/**"
      - "config/**"
      - ".gitlab-ci.yml"
      - "phpstan.neon.dist"
      - "src/**"
      - "tests/**"
      - "composer.json"
      - "composer.lock"
      - "phpstan.neon"
      - "phpunit.xml.dist"
      - "docs/**"
      - "page/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  gate:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ "8.4" ]

    services:
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: smartresponsor
          POSTGRES_USER: smartresponsor
          POSTGRES_PASSWORD: smartresponsor
        options: >-
          --health-cmd="pg_isready -U smartresponsor"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      SR_DOMAIN: "addressing"
      MIN_COVERAGE: "80"
      PANTHER_EXTERNAL_BASE_URI: "http://127.0.0.1:8000"
      APP_ENV: "test"
      ADDRESS_PARITY_DATABASE_URL: "postgresql://smartresponsor:smartresponsor@127.0.0.1:5432/smartresponsor?serverVersion=15&charset=utf8"


    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@d59004228537ca90c8dca680592a08a675bf52b6 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
          coverage: xdebug
          extensions: pdo_sqlite, pdo_pgsql, intl, mbstring, zip

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.composer/cache/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Provision locked sibling dependencies
        env:
          ADDRESSING_GATING_READ_TOKEN: ${{ secrets.ADDRESSING_GATING_READ_TOKEN }}
        run: bash tools/ci/address-provision-locked-siblings.sh

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Doctrine schema parity
        run: composer schema:parity

      - name: Addressing trust gate
        run: composer qa:trust-surface

      - name: Quality checks
        run: |
          composer phpstan
          composer psalm
          composer rector:dry

      - name: PHPUnit with coverage threshold
        shell: bash
        run: |
          set -euo pipefail
          export XDEBUG_MODE=coverage
          export APP_VAR_DIR="$RUNNER_TEMP/symfony-var"
          mkdir -p "$APP_VAR_DIR" build/logs var/coverage
          rm -f build/logs/clover.xml build/logs/junit.xml var/coverage/summary.txt
          php -S 127.0.0.1:8000 -t public public/router.php > build/logs/php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2

          vendor/bin/phpunit --path-coverage --coverage-clover build/logs/clover.xml --log-junit build/logs/junit.xml --coverage-text=var/coverage/summary.txt | tee build/logs/coverage.txt
          test -s var/coverage/summary.txt
          test -s build/logs/junit.xml
          cat var/coverage/summary.txt

          test -s build/logs/clover.xml
          php -r '$x = simplexml_load_file("build/logs/clover.xml"); $m = $x === false ? null : $x->project->metrics; $ns = (string) ($m["statements"] ?? ""); $cs = (string) ($m["coveredstatements"] ?? ""); $n = (int) $ns; $c = (int) $cs; $min = getenv("MIN_COVERAGE"); if (!ctype_digit($ns) || !ctype_digit($cs) || $n <= 0 || $c > $n || $min === false || !is_numeric($min) || (float) $min < 0 || (float) $min > 100) { fwrite(STDERR, "Invalid or missing coverage evidence\n"); exit(1); } $pct = 100 * $c / $n; printf("Coverage: %.2f%%\n", $pct); exit($pct < (float) $min ? 1 : 0);'

          kill $SERVER_PID
          trap - EXIT

      - name: Doctrine mapping smoke check
        run: composer smoke:doctrine

      - name: Canon evaluation with coverage evidence
        run: |
          composer report:behavioral-ui-coverage
          composer gating

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: addressing-report
          path: |
            report/
            build/logs/
            var/coverage/summary.txt
            var/coverage/behavioral-ui.json
          if-no-files-found: error
