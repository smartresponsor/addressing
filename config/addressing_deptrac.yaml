# Managed by Addressing canon cleanup W02
deptrac:
    paths:
        - ../src

    exclude_files:
        - '#.*Test.*#'
        - '#.*Kernel.php#'

    layers:
        -   name: Command
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Command\\.*#'

        -   name: ServiceHttp
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Service\\Http\\.*#'

        -   name: Http
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Http\\.*#'

        -   name: ServiceInterface
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\ServiceInterface\\.*#'

        -   name: Service
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Service\\.*#'

        -   name: RepositoryInterface
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\RepositoryInterface\\.*#'

        -   name: Repository
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Repository\\.*#'

        -   name: Doctrine
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Doctrine\\.*#'

        -   name: Integration
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Integration\\.*#'

        -   name: Contract
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Contract\\.*#'

        -   name: EntityInterface
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\EntityInterface\\.*#'

        -   name: Entity
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Entity\\.*#'

        -   name: Value
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Value\\.*#'

        -   name: Projection
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Projection\\.*#'

        -   name: Util
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\Util\\.*#'

        -   name: UtilInterface
            collectors:
                -   type: classNameRegex
                    value: '#^App\Addressing\\UtilInterface\\.*#'

    ruleset:
        Command:
            - Service
            - ServiceInterface
            - RepositoryInterface
            - Contract
            - EntityInterface
            - Http
            - Value

        ServiceHttp:
            - Http
            - Service
            - ServiceInterface
            - RepositoryInterface
            - Contract
            - EntityInterface
            - Value

        Http:
            - Service
            - ServiceInterface
            - RepositoryInterface
            - Contract
            - EntityInterface
            - Value

        Service:
            - ServiceInterface
            - RepositoryInterface
            - Repository
            - Doctrine
            - Contract
            - EntityInterface
            - Entity
            - Http
            - Value
            - Integration

        Repository:
            - RepositoryInterface
            - Doctrine
            - Contract
            - EntityInterface
            - Entity
            - Value
            - Integration

        Doctrine:
            - Entity
            - EntityInterface
            - Value

        Integration:
            - Contract
            - EntityInterface
            - Entity
            - Value

        Projection:
            - Entity
            - Value
            - Integration

        Util:
            - UtilInterface

        ServiceInterface: ~
        Contract: ~
        EntityInterface: ~
        Entity: ~
        Value: ~
        RepositoryInterface:
            - Value
            - EntityInterface
        UtilInterface: ~
