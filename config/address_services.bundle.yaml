services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Addressing\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Addressing\Service\Http\Address\AddressManageHttpService:
        public: true
    App\Addressing\Service\Http\Address\AddressWriteHttpService:
        public: true
    App\Addressing\Service\Http\Address\AddressReadHttpService:
        public: true
    App\Addressing\Service\Http\Address\AddressSummaryHttpService:
        public: true
    App\Addressing\Service\Http\Address\AddressOperationalHttpService:
        public: true
    App\Addressing\Service\Application\AddressOutboxDrainerService:
        public: true

    App\Addressing\RepositoryInterface\AddressWriteRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressWriteRepository'
    App\Addressing\RepositoryInterface\AddressReadRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressReadRepository'
    App\Addressing\RepositoryInterface\AddressEvidenceRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressEvidenceRepository'
    App\Addressing\RepositoryInterface\AddressOperationalRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressOperationalRepository'
    App\Addressing\RepositoryInterface\AddressQueueRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressQueueRepository'
    App\Addressing\RepositoryInterface\AddressGovernanceRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressGovernanceRepository'
    App\Addressing\RepositoryInterface\AddressPortfolioRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressPortfolioRepository'
    App\Addressing\RepositoryInterface\AddressIndex\AddressIndexRepositoryInterface: '@App\Addressing\Repository\AddressIndex\DoctrineAddressIndexRepository'
    App\Addressing\RepositoryInterface\AddressSchemaRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressSchemaRepository'
    App\Addressing\RepositoryInterface\AddressOutboxDispatchRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressOutboxDispatchRepository'
    App\Addressing\RepositoryInterface\AddressValidatedPersistenceRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressValidatedPersistenceRepository'
    App\Addressing\RepositoryInterface\AddressRateLimitRepositoryInterface: '@App\Addressing\Repository\DoctrineAddressRateLimitRepository'

    App\Addressing\Service\Http\Address\AddressRateLimiterService:
        public: true

    App\Addressing\Service\Fixture\AddressDemoFixtureService:
        public: true
